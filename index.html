<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; }      /* mobile: page itself never scrolls */
    body {
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
      padding: 12px;
    }
    canvas {
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      width: 100%;
      max-width: min(800px, calc(80vh * 4 / 3));
      height: auto;
      aspect-ratio: 4 / 3;
      touch-action: none;   /* don't scroll/zoom on touch over the canvas */
      display: block;
    }
    #controls {
      margin-top: 16px;
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      letter-spacing: 0.05em;
      text-align: center;
    }
    #difficulty {
      margin-top: 12px;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      letter-spacing: 0.05em;
    }
    #difficulty button {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6);
      padding: 4px 12px;
      cursor: pointer;
      border-radius: 3px;
      font-family: monospace;
      font-size: 13px;
      letter-spacing: 0.05em;
    }
    #difficulty button:hover {
      border-color: rgba(255,255,255,0.5);
    }
    #difficulty button.active {
      background: rgba(255,255,255,0.1);
      color: white;
      border-color: rgba(255,255,255,0.5);
    }
    #game-actions {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    #game-actions button {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6);
      padding: 4px 12px;
      cursor: pointer;
      border-radius: 3px;
      font-family: monospace;
      font-size: 13px;
      letter-spacing: 0.05em;
      min-width: 80px;
    }
    #game-actions button:hover:not(:disabled) {
      border-color: rgba(255,255,255,0.5);
    }
    #game-actions button.active {
      background: rgba(255,255,255,0.1);
      color: white;
      border-color: rgba(255,255,255,0.5);
    }
    #game-actions button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    #touchpad {
      display: none;                       /* shown only on touch devices */
      margin-top: 12px;
      width: 100%;
      max-width: 360px;
      height: clamp(90px, 18vh, 160px);
      border: 1px dashed rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      color: rgba(255,255,255,0.35);
      font-size: 12px;
      letter-spacing: 0.08em;
      align-items: center;
      justify-content: center;
      touch-action: none;
      user-select: none;
    }
    @media (pointer: coarse) {
      #touchpad { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="controls">W / S or ↑ / ↓ move &nbsp;·&nbsp; Space start &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M mute</div>
  <div id="difficulty">
    Difficulty
    <button data-level="easy">Easy</button>
    <button data-level="medium" class="active">Medium</button>
    <button data-level="hard">Hard</button>
  </div>
  <div id="game-actions">
    <button id="pauseBtn">Pause</button>
    <button id="muteBtn">Mute</button>
  </div>
  <div id="touchpad">DRAG TO MOVE</div>

  <script>
    // ─────────────────────────────────────────────────────────────────────────
    // CONSTANTS
    // These control the look and feel of the game. Try changing them!
    // ─────────────────────────────────────────────────────────────────────────

    const W             = 800;   // Canvas width in pixels
    const H             = 600;   // Canvas height in pixels
    const PADDLE_W      = 12;    // Paddle width in pixels
    const PADDLE_H      = 80;    // Paddle height in pixels
    const PADDLE_SPEED  = 6;     // How fast paddles move (pixels per frame)
    const BALL_R        = 8;     // Ball radius in pixels
    const BALL_SPEED    = 5;     // Starting ball speed
    const WINNING_SCORE = 7;     // First to this score wins

    // ─────────────────────────────────────────────────────────────────────────
    // SETUP
    // ─────────────────────────────────────────────────────────────────────────

    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');
    canvas.width  = W;
    canvas.height = H;

    // ─────────────────────────────────────────────────────────────────────────
    // GAME STATE
    // These objects hold the current position and velocity of everything.
    // ─────────────────────────────────────────────────────────────────────────

    let ball   = { x: 0, y: 0, vx: 0, vy: 0 };
    let player = { y: H / 2 - PADDLE_H / 2 };   // top-left y of player paddle
    let ai     = { y: H / 2 - PADDLE_H / 2 };   // top-left y of AI paddle
    let score  = { player: 0, ai: 0 };
    let keys   = {};                              // which keys are currently held
    let phase  = 'waiting';                       // 'waiting' | 'playing' | 'paused' | 'over'
    let muted  = false;

    // Visual-polish state (timestamps in ms; 0 = no flash active)
    let playerHitFlashUntil   = 0;
    let aiHitFlashUntil       = 0;
    let leftScoreFlashUntil   = 0;   // AI scored — flash the left (player's) side
    let rightScoreFlashUntil  = 0;   // player scored — flash the right (AI's) side
    const HIT_FLASH_MS   = 80;
    const SCORE_FLASH_MS = 250;
    const reduceMotion   = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    // ─────────────────────────────────────────────────────────────────────────
    // AI DIFFICULTY
    // The AI already has a per-rally skill model (lapse / default / sharp).
    // Difficulty changes the *mix* — easy = mostly lapses, hard = mostly sharp
    // rallies. See DIFFICULTY_DISTRIBUTIONS inside getAiMove.
    // ─────────────────────────────────────────────────────────────────────────

    let aiDifficulty = 'medium';

    document.querySelectorAll('#difficulty button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#difficulty button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        aiDifficulty = btn.dataset.level;
        btn.blur();   // release focus so Space / arrows still work
      });
    });

    // ─────────────────────────────────────────────────────────────────────────
    // AUDIO
    // Tones synthesized via Web Audio API — no files, no deps.
    // Safari blocks Web Audio more strictly than Chrome: even after
    // ctx.resume() the first sounds are silently swallowed unless we
    // play a silent buffer source from inside a real user gesture.
    // unlockAudio() does that; until it runs (called from keydown/click),
    // blip()/chirp() are no-ops.
    // ─────────────────────────────────────────────────────────────────────────

    let audioCtx       = null;
    let audioUnlocked  = false;

    function unlockAudio() {
      if (audioUnlocked) return;
      if (!audioCtx) {
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return;
        audioCtx = new Ctor();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      // Silent buffer source — the "unlock" trick that satisfies Safari.
      const buf = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      src.start(0);
      audioUnlocked = true;
    }

    function blip(freq, duration = 0.06, type = 'square', volume = 0.12) {
      if (muted || !audioUnlocked || !audioCtx) return;
      const t0   = audioCtx.currentTime;
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      // Single-decay envelope — simpler and more reliable than attack+decay on Safari
      gain.gain.setValueAtTime(volume, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.02);
    }

    function chirp(startFreq, endFreq, duration = 0.22, volume = 0.16) {
      if (muted || !audioUnlocked || !audioCtx) return;
      const t0   = audioCtx.currentTime;
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(startFreq, t0);
      osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + duration);
      gain.gain.setValueAtTime(volume, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.02);
    }

    // ─────────────────────────────────────────────────────────────────────────
    // INPUT
    // ─────────────────────────────────────────────────────────────────────────

    function refreshControlsLabel() {
      document.getElementById('controls').innerHTML =
        `W / S or ↑ / ↓ move &nbsp;·&nbsp; Space start &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M ${muted ? '<strong>unmute</strong>' : 'mute'}`;
    }

    function togglePause() {
      if (phase === 'playing')     phase = 'paused';
      else if (phase === 'paused') phase = 'playing';
      refreshGameActionButtons();
    }
    function toggleMute() {
      muted = !muted;
      refreshControlsLabel();
      refreshGameActionButtons();
    }
    function refreshGameActionButtons() {
      const pauseBtn = document.getElementById('pauseBtn');
      const muteBtn  = document.getElementById('muteBtn');
      pauseBtn.textContent = phase === 'paused' ? 'Resume' : 'Pause';
      pauseBtn.classList.toggle('active', phase === 'paused');
      pauseBtn.disabled    = !(phase === 'playing' || phase === 'paused');
      muteBtn.textContent  = muted ? 'Unmute' : 'Mute';
      muteBtn.classList.toggle('active', muted);
    }
    document.getElementById('pauseBtn').addEventListener('click', e => {
      togglePause();
      e.currentTarget.blur();
    });
    document.getElementById('muteBtn').addEventListener('click', e => {
      toggleMute();
      e.currentTarget.blur();
    });

    document.addEventListener('keydown', e => {
      unlockAudio();   // safe to call on every keypress; only does work once
      keys[e.key] = true;
      if (e.key === ' ' || e.key === 'Enter') {
        if (phase === 'waiting') startRound();
        if (phase === 'over')    resetGame();
      }
      if (e.key === 'p' || e.key === 'P') togglePause();
      if (e.key === 'm' || e.key === 'M') toggleMute();
    });
    document.addEventListener('keyup', e => { keys[e.key] = false; });
    // Safari is happiest unlocking audio on an actual pointer event, not
    // just keydown. Listen on the document so any click on the page works.
    document.addEventListener('pointerdown', unlockAudio, { passive: true });

    // Touch input.
    //
    // The canvas itself is for *viewing*: tapping it advances the phase
    // (start round, play again) but never moves the paddle, since a finger
    // on the play field obscures the opponent's side.
    //
    // The #touchpad below the canvas is the *playing surface*: drag your
    // finger on it and the paddle Y follows proportionally.

    const touchpad = document.getElementById('touchpad');
    let padAnchor = null;   // {touchY, paddleY} anchored at touchstart

    function advancePhaseIfWaiting() {
      if (phase === 'waiting') startRound();
      else if (phase === 'over') resetGame();
    }
    function applyPadDelta(touch) {
      if (!padAnchor) return;
      const rect = touchpad.getBoundingClientRect();
      const scale = (H - PADDLE_H) / rect.height;   // full pad drag = full paddle range
      const newY  = padAnchor.paddleY + (touch.clientY - padAnchor.touchY) * scale;
      player.y = Math.max(0, Math.min(H - PADDLE_H, newY));
    }

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      unlockAudio();
      advancePhaseIfWaiting();
    }, { passive: false });
    touchpad.addEventListener('touchstart', e => {
      e.preventDefault();
      unlockAudio();
      advancePhaseIfWaiting();
      if (e.touches.length > 0) {
        padAnchor = { touchY: e.touches[0].clientY, paddleY: player.y };
      }
    }, { passive: false });
    touchpad.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length > 0) applyPadDelta(e.touches[0]);
    }, { passive: false });
    touchpad.addEventListener('touchend',    () => { padAnchor = null; }, { passive: true });
    touchpad.addEventListener('touchcancel', () => { padAnchor = null; }, { passive: true });

    // ─────────────────────────────────────────────────────────────────────────
    // ROUND / GAME MANAGEMENT
    // ─────────────────────────────────────────────────────────────────────────

    function startRound() {
      // Launch the ball from the centre in a random direction
      const angle = (Math.random() * 0.6 - 0.3);            // slight angle variation
      const dir   = Math.random() > 0.5 ? 1 : -1;           // left or right
      ball = {
        x:  W / 2,
        y:  H / 2,
        vx: dir * BALL_SPEED * Math.cos(angle),
        vy: BALL_SPEED * Math.sin(angle),
      };
      phase = 'playing';
    }

    function resetGame() {
      score = { player: 0, ai: 0 };
      player.y = H / 2 - PADDLE_H / 2;
      ai.y     = H / 2 - PADDLE_H / 2;
      phase    = 'waiting';
    }

    // ─────────────────────────────────────────────────────────────────────────
    // PLAYER MOVEMENT
    // ─────────────────────────────────────────────────────────────────────────

    function movePlayer() {
      if (keys['ArrowUp']   || keys['w'] || keys['W']) {
        player.y = Math.max(0, player.y - PADDLE_SPEED);
      }
      if (keys['ArrowDown'] || keys['s'] || keys['S']) {
        player.y = Math.min(H - PADDLE_H, player.y + PADDLE_SPEED);
      }
    }

    // ─────────────────────────────────────────────────────────────────────────
    // BALL PHYSICS
    // ─────────────────────────────────────────────────────────────────────────

    function moveBall() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Bounce off top and bottom walls
      if (ball.y - BALL_R < 0) {
        ball.y  = BALL_R;
        ball.vy = Math.abs(ball.vy);
        blip(220, 0.04, 'triangle', 0.08);
      }
      if (ball.y + BALL_R > H) {
        ball.y  = H - BALL_R;
        ball.vy = -Math.abs(ball.vy);
        blip(220, 0.04, 'triangle', 0.08);
      }

      // Player paddle is on the left at x = 20
      const playerX = 20;
      if (ball.vx < 0
          && ball.x - BALL_R <= playerX + PADDLE_W
          && ball.x - BALL_R >= playerX
          && ball.y >= player.y
          && ball.y <= player.y + PADDLE_H) {
        ball.x  = playerX + PADDLE_W + BALL_R;
        ball.vx = Math.abs(ball.vx) * 1.04;            // small speed increase each hit
        ball.vy = ((ball.y - (player.y + PADDLE_H / 2)) / (PADDLE_H / 2)) * 6;
        blip(660);
        playerHitFlashUntil = performance.now() + HIT_FLASH_MS;
      }

      // AI paddle is on the right at x = W - 20 - PADDLE_W
      const aiX = W - 20 - PADDLE_W;
      if (ball.vx > 0
          && ball.x + BALL_R >= aiX
          && ball.x + BALL_R <= aiX + PADDLE_W + BALL_R
          && ball.y >= ai.y
          && ball.y <= ai.y + PADDLE_H) {
        ball.x  = aiX - BALL_R;
        ball.vx = -Math.abs(ball.vx) * 1.04;
        ball.vy = ((ball.y - (ai.y + PADDLE_H / 2)) / (PADDLE_H / 2)) * 6;
        blip(440);
        aiHitFlashUntil = performance.now() + HIT_FLASH_MS;
      }

      // Ball left the screen — award a point
      if (ball.x < -BALL_R) {
        score.ai++;
        chirp(440, 220);
        leftScoreFlashUntil = performance.now() + SCORE_FLASH_MS;
        phase = score.ai >= WINNING_SCORE ? 'over' : 'waiting';
      }
      if (ball.x > W + BALL_R) {
        score.player++;
        chirp(440, 880);
        rightScoreFlashUntil = performance.now() + SCORE_FLASH_MS;
        phase = score.player >= WINNING_SCORE ? 'over' : 'waiting';
      }
    }

    // ─────────────────────────────────────────────────────────────────────────
    // AI MOVEMENT
    // ─────────────────────────────────────────────────────────────────────────
    //
    // getAiMove() is called every frame and returns:
    //   -1 → move up, 0 → stay, 1 → move down.
    //
    // It receives a gameState snapshot:
    //   ball.x / ball.y / ball.vx / ball.vy    — position and velocity
    //   ai.y / player.y                        — paddle top edges
    //   paddleHeight, canvasWidth, canvasHeight
    //
    // ─────────────────────────────────────────────────────────────────────────
    //
    // AI ARCHITECTURE — four stacked layers of human-like imperfection.
    //
    //   1. PERCEPTION
    //      ballHistory ring buffer. We plan against the ball as it was
    //      `rallyProfile.reactionFrames` frames ago, not as it is now.
    //
    //   2. PREDICTION
    //      predictLandingY(): linear extrapolation to estimate landing-y at
    //      the AI's x (incoming) or contact-y at the player's x (outgoing
    //      / anticipation). No wall-bounce modelling — out-of-bounds
    //      landings are clamped (a small handicap on sharp vertical shots).
    //
    //   3. SKILL PROFILE — the dominant source of variance.
    //      At the start of each rally sampleSkill() picks one of:
    //        SKILL_LAPSE (sluggish, big persistent y-bias)
    //        SKILL_DEFAULT (peer-level)
    //        SKILL_SHARP (fast, accurate, rare flash of brilliance)
    //      The profile drives reaction lag, noise multiplier, persistent
    //      whole-rally y-bias, anticipation commitment, switch-stutter
    //      frames, and overshoot probability. DIFFICULTY_DISTRIBUTIONS
    //      controls the mix per difficulty.
    //
    //   4. MOTOR
    //      Humans can't reverse direction instantly and often hold a press
    //      a frame or two past optimal. stutterRemaining (pause on
    //      direction change) and overshootRemaining (extra frames on stop)
    //      model this.
    //
    // Main tuning knobs:
    //   DIFFICULTY_DISTRIBUTIONS     — overall feel per difficulty level
    //   SKILL_*.reactionFrames       — perceived ball lag
    //   SKILL_*.noiseMul             — read accuracy
    //   SKILL_*.persistentErrorRange — magnitude of whole-rally lapses
    //   SKILL_*.overshootChance      — visible "human" key-holding
    //
    // All values tuned at ~60 fps. See "Frame-rate dependence" in
    // CLAUDE.md if running on a high-refresh display.

    const getAiMove = (() => {

      const MAX_REACTION_FRAMES = 16;   // upper bound — actual delay depends on rally profile
      const ARRIVE_TOLERANCE    = 6;
      const REREAD_EVERY        = 6;    // re-evaluate every ~100ms during flight or recovery
      const REPLAN_THRESHOLD    = 14;   // only commit to a new target if estimate moved meaningfully
      const READ_NOISE_START    = 32;
      const READ_NOISE_END      = 4;
      const ANTICIPATE_NOISE       = 30;
      const ANTICIPATE_COMMITMENT  = 0.4;
      const TELEPORT_PX         = 50;
      const OVERSHOOT_FRAMES    = [1, 2];

      // Per-rally skill profiles. Sampled at the start of each rally to model
      // the natural variance in a human player — bad reads, average reads,
      // and the occasional flash of brilliance.
      //
      // persistentErrorRange is the magnitude of a y-error that lasts the
      // whole rally — micro-reads only shrink it slightly, so a lapse stays
      // a lapse all the way through.
      const SKILL_LAPSE = {
        name: 'lapse',
        reactionFrames:       14,
        noiseMul:             1.5,
        persistentErrorRange: 80,
        commitmentMul:        0.4,
        switchFrames:         [5, 6, 8],
        overshootChance:      0.45,
      };
      const SKILL_DEFAULT = {
        name: 'default',
        reactionFrames:       9,
        noiseMul:             1.0,
        persistentErrorRange: 30,
        commitmentMul:        1.0,
        switchFrames:         [3, 4, 5],
        overshootChance:      0.20,
      };
      const SKILL_SHARP = {
        name: 'sharp',
        reactionFrames:       4,
        noiseMul:             0.3,
        persistentErrorRange: 3,
        commitmentMul:        1.3,
        switchFrames:         [2, 2, 3],
        overshootChance:      0.05,
      };
      const DIFFICULTY_DISTRIBUTIONS = {
        easy:   [[SKILL_LAPSE, 0.60], [SKILL_DEFAULT, 0.38], [SKILL_SHARP, 0.02]],
        medium: [[SKILL_LAPSE, 0.35], [SKILL_DEFAULT, 0.55], [SKILL_SHARP, 0.10]],
        hard:   [[SKILL_LAPSE, 0.10], [SKILL_DEFAULT, 0.50], [SKILL_SHARP, 0.40]],
      };
      function sampleSkill() {
        const dist = DIFFICULTY_DISTRIBUTIONS[aiDifficulty] || DIFFICULTY_DISTRIBUTIONS.medium;
        const r = Math.random();
        let acc = 0;
        for (const [profile, p] of dist) {
          acc += p;
          if (r < acc) return profile;
        }
        return SKILL_DEFAULT;
      }

      const ballHistory       = [];
      let   prevVx            = 0;
      let   prevPerceivedX    = null;
      let   phase             = 'rest'; // 'rest' | 'flying'
      let   targetY           = null;
      let   rereadCounter     = 0;
      let   lastDir           = 0;
      let   stutterRemaining  = 0;
      let   overshootRemaining = 0;
      let   rallyProfile      = sampleSkill();
      let   rallyError        = (Math.random() - 0.5) * 2 * rallyProfile.persistentErrorRange;

      function predictLandingY(b, aiX) {
        if (b.vx <= 0) return null;
        const t = (aiX - b.x) / b.vx;
        return b.y + b.vy * t;
      }

      function flightProgress(perceivedX, W) {
        const start = 20 + PADDLE_W;
        const end   = W - 20 - PADDLE_W;
        return Math.max(0, Math.min(1, (perceivedX - start) / (end - start)));
      }

      function noisyTarget(landing, noisePx, paddleH, H) {
        // rallyError is a persistent y-bias for the current rally — closure-scoped.
        const biased = landing + rallyError;
        const noisy  = biased + (Math.random() - 0.5) * 2 * noisePx;
        return Math.max(paddleH / 2, Math.min(H - paddleH / 2, noisy));
      }

      return function (gameState) {
        ballHistory.push({
          x:  gameState.ball.x,
          y:  gameState.ball.y,
          vx: gameState.ball.vx,
          vy: gameState.ball.vy,
        });
        if (ballHistory.length > MAX_REACTION_FRAMES) ballHistory.shift();

        const reactionIdx = Math.max(0, ballHistory.length - 1 - rallyProfile.reactionFrames);
        const perceived = ballHistory[reactionIdx];
        const W = gameState.canvasWidth;
        const H = gameState.canvasHeight;
        const aiX = W - 20 - PADDLE_W;
        const paddleH = gameState.paddleHeight;
        const paddleCenter = gameState.ai.y + paddleH / 2;

        const teleported = prevPerceivedX !== null
          && Math.abs(perceived.x - prevPerceivedX) > TELEPORT_PX;
        const incomingStarted = (prevVx <= 0 && perceived.vx > 0)
          || (teleported && perceived.vx > 0);

        if (incomingStarted) {
          // New rally on round reset — sample a fresh skill profile and error
          if (teleported) {
            rallyProfile = sampleSkill();
            rallyError   = (Math.random() - 0.5) * 2 * rallyProfile.persistentErrorRange;
          }
          const landing = predictLandingY(perceived, aiX);
          if (landing !== null) {
            targetY = noisyTarget(landing, READ_NOISE_START * rallyProfile.noiseMul, paddleH, H);
          }
          phase = 'flying';
          rereadCounter = 0;
        } else if (phase === 'flying' && perceived.vx > 0) {
          rereadCounter++;
          if (rereadCounter >= REREAD_EVERY) {
            rereadCounter = 0;
            const landing = predictLandingY(perceived, aiX);
            if (landing !== null) {
              const progress = flightProgress(perceived.x, W);
              const baseNoise = READ_NOISE_START + (READ_NOISE_END - READ_NOISE_START) * progress;
              const candidate = noisyTarget(landing, baseNoise * rallyProfile.noiseMul, paddleH, H);
              if (targetY === null || Math.abs(candidate - targetY) > REPLAN_THRESHOLD) {
                targetY = candidate;
              }
            }
          }
        } else if (perceived.vx < 0) {
          if (phase !== 'rest') {
            phase = 'rest';
            rereadCounter = 0;
          }
          rereadCounter++;
          if (rereadCounter >= REREAD_EVERY) {
            rereadCounter = 0;
            const playerX = 20 + PADDLE_W;
            let candidate = H / 2;
            if (perceived.x > playerX) {
              const t = (playerX - perceived.x) / perceived.vx;
              const predictedContactY = perceived.y + perceived.vy * t;
              const commitment = ANTICIPATE_COMMITMENT * rallyProfile.commitmentMul;
              const blended = H / 2 + commitment * (predictedContactY - H / 2);
              candidate = noisyTarget(blended, ANTICIPATE_NOISE * rallyProfile.noiseMul, paddleH, H);
            }
            if (targetY === null || Math.abs(candidate - targetY) > REPLAN_THRESHOLD) {
              targetY = candidate;
            }
          }
        }

        prevVx = perceived.vx;
        prevPerceivedX = perceived.x;

        // Pick the direction we'd ideally press this frame
        let desiredDir = 0;
        if (targetY !== null) {
          const delta = targetY - paddleCenter;
          if (Math.abs(delta) > ARRIVE_TOLERANCE) desiredDir = delta < 0 ? -1 : 1;
        }

        // Motor modelling: humans can't switch keys instantly, and they often
        // hold a press a frame or two past the optimal stop point.
        if (stutterRemaining > 0) {
          stutterRemaining--;
          return 0;
        }
        if (overshootRemaining > 0) {
          overshootRemaining--;
          return lastDir;
        }
        if (lastDir !== 0 && desiredDir === 0 && Math.random() < rallyProfile.overshootChance) {
          overshootRemaining = OVERSHOOT_FRAMES[Math.floor(Math.random() * OVERSHOOT_FRAMES.length)];
          return lastDir;
        }
        if (lastDir !== 0 && desiredDir !== 0 && desiredDir !== lastDir) {
          const sf = rallyProfile.switchFrames;
          stutterRemaining = sf[Math.floor(Math.random() * sf.length)];
          lastDir = 0;
          return 0;
        }

        lastDir = desiredDir;
        return desiredDir;
      };
    })();

    // Applies the result of getAiMove() to the AI paddle position
    function moveAi() {
      const direction = getAiMove({
        ball:         { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy },
        ai:           { y: ai.y },
        player:       { y: player.y },
        paddleHeight: PADDLE_H,
        canvasWidth:  W,
        canvasHeight: H,
      });

      if (direction === -1) ai.y = Math.max(0,          ai.y - PADDLE_SPEED);
      if (direction ===  1) ai.y = Math.min(H - PADDLE_H, ai.y + PADDLE_SPEED);
    }

    // ─────────────────────────────────────────────────────────────────────────
    // DRAWING
    // ─────────────────────────────────────────────────────────────────────────

    function draw() {
      const now = performance.now();
      refreshGameActionButtons();   // keep pause/mute button labels in sync with phase

      // Background
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, W, H);

      // Score-side flashes (subtle, single-shot per point; respects prefers-reduced-motion)
      if (!reduceMotion) {
        if (now < leftScoreFlashUntil) {
          const a = 0.22 * ((leftScoreFlashUntil - now) / SCORE_FLASH_MS);
          ctx.fillStyle = `rgba(220, 140, 80, ${a})`;
          ctx.fillRect(0, 0, W / 2, H);
        }
        if (now < rightScoreFlashUntil) {
          const a = 0.22 * ((rightScoreFlashUntil - now) / SCORE_FLASH_MS);
          ctx.fillStyle = `rgba(120, 220, 180, ${a})`;
          ctx.fillRect(W / 2, 0, W / 2, H);
        }
      }

      // Centre dashed line
      ctx.save();
      ctx.setLineDash([10, 12]);
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(W / 2, 0);
      ctx.lineTo(W / 2, H);
      ctx.stroke();
      ctx.restore();

      // Score
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.font = 'bold 52px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(score.player, W / 2 - 90, 70);
      ctx.fillText(score.ai,     W / 2 + 90, 70);

      // Player paddle (left) — brighter for ~80ms after a hit
      ctx.fillStyle = (!reduceMotion && now < playerHitFlashUntil) ? '#ffffff' : '#e0e0e0';
      ctx.beginPath();
      ctx.roundRect(20, player.y, PADDLE_W, PADDLE_H, 3);
      ctx.fill();

      // AI paddle (right) — brighter for ~80ms after a hit
      ctx.fillStyle = (!reduceMotion && now < aiHitFlashUntil) ? '#ffffff' : '#e0e0e0';
      ctx.beginPath();
      ctx.roundRect(W - 20 - PADDLE_W, ai.y, PADDLE_W, PADDLE_H, 3);
      ctx.fill();

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fill();

      // Overlay messages
      if (phase === 'waiting') {
        const isStart = score.player === 0 && score.ai === 0;
        drawOverlay(isStart ? 'PONG' : 'Point over', 'Press Space to continue');
      }
      if (phase === 'paused') {
        drawOverlay('Paused', 'Press P to continue');
      }
      if (phase === 'over') {
        const won = score.player >= WINNING_SCORE;
        drawOverlay(won ? 'You win!' : 'AI wins!', 'Press Space to play again');
      }
    }

    function drawOverlay(title, subtitle) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 56px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(title, W / 2, H / 2 - 18);

      ctx.font = '20px monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText(subtitle, W / 2, H / 2 + 28);
    }

    // ─────────────────────────────────────────────────────────────────────────
    // GAME LOOP
    // requestAnimationFrame runs this ~60 times per second
    // ─────────────────────────────────────────────────────────────────────────

    function gameLoop() {
      if (phase === 'playing') {
        movePlayer();
        moveAi();
        moveBall();
      }
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
