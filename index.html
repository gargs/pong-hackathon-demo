<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
    }
    canvas {
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
    }
    #controls {
      margin-top: 16px;
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="controls">W / S or ↑ / ↓ to move &nbsp;·&nbsp; Space to start</div>

  <script>
    // ─────────────────────────────────────────────────────────────────────────
    // CONSTANTS
    // These control the look and feel of the game. Try changing them!
    // ─────────────────────────────────────────────────────────────────────────

    const W             = 800;   // Canvas width in pixels
    const H             = 600;   // Canvas height in pixels
    const PADDLE_W      = 12;    // Paddle width in pixels
    const PADDLE_H      = 80;    // Paddle height in pixels
    const PADDLE_SPEED  = 6;     // How fast paddles move (pixels per frame)
    const BALL_R        = 8;     // Ball radius in pixels
    const BALL_SPEED    = 5;     // Starting ball speed
    const WINNING_SCORE = 7;     // First to this score wins

    // ─────────────────────────────────────────────────────────────────────────
    // SETUP
    // ─────────────────────────────────────────────────────────────────────────

    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');
    canvas.width  = W;
    canvas.height = H;

    // ─────────────────────────────────────────────────────────────────────────
    // GAME STATE
    // These objects hold the current position and velocity of everything.
    // ─────────────────────────────────────────────────────────────────────────

    let ball   = { x: 0, y: 0, vx: 0, vy: 0 };
    let player = { y: H / 2 - PADDLE_H / 2 };   // top-left y of player paddle
    let ai     = { y: H / 2 - PADDLE_H / 2 };   // top-left y of AI paddle
    let score  = { player: 0, ai: 0 };
    let keys   = {};                              // which keys are currently held
    let phase  = 'waiting';                       // 'waiting' | 'playing' | 'over'

    // ─────────────────────────────────────────────────────────────────────────
    // INPUT
    // ─────────────────────────────────────────────────────────────────────────

    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ' || e.key === 'Enter') {
        if (phase === 'waiting') startRound();
        if (phase === 'over')    resetGame();
      }
    });
    document.addEventListener('keyup', e => { keys[e.key] = false; });

    // ─────────────────────────────────────────────────────────────────────────
    // ROUND / GAME MANAGEMENT
    // ─────────────────────────────────────────────────────────────────────────

    function startRound() {
      // Launch the ball from the centre in a random direction
      const angle = (Math.random() * 0.6 - 0.3);            // slight angle variation
      const dir   = Math.random() > 0.5 ? 1 : -1;           // left or right
      ball = {
        x:  W / 2,
        y:  H / 2,
        vx: dir * BALL_SPEED * Math.cos(angle),
        vy: BALL_SPEED * Math.sin(angle),
      };
      phase = 'playing';
    }

    function resetGame() {
      score = { player: 0, ai: 0 };
      player.y = H / 2 - PADDLE_H / 2;
      ai.y     = H / 2 - PADDLE_H / 2;
      phase    = 'waiting';
    }

    // ─────────────────────────────────────────────────────────────────────────
    // PLAYER MOVEMENT
    // ─────────────────────────────────────────────────────────────────────────

    function movePlayer() {
      if (keys['ArrowUp']   || keys['w'] || keys['W']) {
        player.y = Math.max(0, player.y - PADDLE_SPEED);
      }
      if (keys['ArrowDown'] || keys['s'] || keys['S']) {
        player.y = Math.min(H - PADDLE_H, player.y + PADDLE_SPEED);
      }
    }

    // ─────────────────────────────────────────────────────────────────────────
    // BALL PHYSICS
    // ─────────────────────────────────────────────────────────────────────────

    function moveBall() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Bounce off top and bottom walls
      if (ball.y - BALL_R < 0) {
        ball.y  = BALL_R;
        ball.vy = Math.abs(ball.vy);
      }
      if (ball.y + BALL_R > H) {
        ball.y  = H - BALL_R;
        ball.vy = -Math.abs(ball.vy);
      }

      // Player paddle is on the left at x = 20
      const playerX = 20;
      if (ball.vx < 0
          && ball.x - BALL_R <= playerX + PADDLE_W
          && ball.x - BALL_R >= playerX
          && ball.y >= player.y
          && ball.y <= player.y + PADDLE_H) {
        ball.x  = playerX + PADDLE_W + BALL_R;
        ball.vx = Math.abs(ball.vx) * 1.04;            // small speed increase each hit
        ball.vy = ((ball.y - (player.y + PADDLE_H / 2)) / (PADDLE_H / 2)) * 6;
      }

      // AI paddle is on the right at x = W - 20 - PADDLE_W
      const aiX = W - 20 - PADDLE_W;
      if (ball.vx > 0
          && ball.x + BALL_R >= aiX
          && ball.x + BALL_R <= aiX + PADDLE_W + BALL_R
          && ball.y >= ai.y
          && ball.y <= ai.y + PADDLE_H) {
        ball.x  = aiX - BALL_R;
        ball.vx = -Math.abs(ball.vx) * 1.04;
        ball.vy = ((ball.y - (ai.y + PADDLE_H / 2)) / (PADDLE_H / 2)) * 6;
      }

      // Ball left the screen — award a point
      if (ball.x < -BALL_R) {
        score.ai++;
        phase = score.ai >= WINNING_SCORE ? 'over' : 'waiting';
      }
      if (ball.x > W + BALL_R) {
        score.player++;
        phase = score.player >= WINNING_SCORE ? 'over' : 'waiting';
      }
    }

    // ─────────────────────────────────────────────────────────────────────────
    // AI MOVEMENT  ←  THIS IS YOUR CHALLENGE
    // ─────────────────────────────────────────────────────────────────────────
    //
    // getAiMove() is called every frame while the game is running.
    // It receives a snapshot of the game state and must return:
    //
    //   -1  →  move the AI paddle UP
    //    0  →  keep the AI paddle still
    //    1  →  move the AI paddle DOWN
    //
    // Right now it always returns 0, so the AI never moves and loses every point.
    //
    // The gameState object contains:
    //
    //   gameState.ball.x        — horizontal position of the ball (0 = left edge)
    //   gameState.ball.y        — vertical position of the ball (0 = top edge)
    //   gameState.ball.vx       — horizontal speed (positive = moving right)
    //   gameState.ball.vy       — vertical speed (positive = moving down)
    //   gameState.ai.y          — top edge of the AI paddle
    //   gameState.player.y      — top edge of the player paddle
    //   gameState.paddleHeight  — height of a paddle in pixels (80)
    //   gameState.canvasWidth   — canvas width in pixels (800)
    //   gameState.canvasHeight  — canvas height in pixels (600)
    //
    // Tip: the centre of the AI paddle is at:  gameState.ai.y + gameState.paddleHeight / 2
    //
    // ─────────────────────────────────────────────────────────────────────────

    const getAiMove = (() => {
      const REACTION_FRAMES = 12;   // ~200ms at 60fps — typical human reaction time
      const AI_DEADZONE     = 8;
      const ballHistory     = [];

      return function (gameState) {
        ballHistory.push(gameState.ball.y);
        if (ballHistory.length > REACTION_FRAMES) ballHistory.shift();

        const perceivedBallY = ballHistory[0];   // ball as it was REACTION_FRAMES ago
        const paddleCenter   = gameState.ai.y + gameState.paddleHeight / 2;
        const delta          = perceivedBallY - paddleCenter;

        if (delta < -AI_DEADZONE) return -1;
        if (delta >  AI_DEADZONE) return  1;
        return 0;
      };
    })();

    // Applies the result of getAiMove() to the AI paddle position
    function moveAi() {
      const direction = getAiMove({
        ball:         { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy },
        ai:           { y: ai.y },
        player:       { y: player.y },
        paddleHeight: PADDLE_H,
        canvasWidth:  W,
        canvasHeight: H,
      });

      if (direction === -1) ai.y = Math.max(0,          ai.y - PADDLE_SPEED);
      if (direction ===  1) ai.y = Math.min(H - PADDLE_H, ai.y + PADDLE_SPEED);
    }

    // ─────────────────────────────────────────────────────────────────────────
    // DRAWING
    // ─────────────────────────────────────────────────────────────────────────

    function draw() {
      // Background
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, W, H);

      // Centre dashed line
      ctx.save();
      ctx.setLineDash([10, 12]);
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(W / 2, 0);
      ctx.lineTo(W / 2, H);
      ctx.stroke();
      ctx.restore();

      // Score
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.font = 'bold 52px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(score.player, W / 2 - 90, 70);
      ctx.fillText(score.ai,     W / 2 + 90, 70);

      // Player paddle (left)
      ctx.fillStyle = '#e0e0e0';
      ctx.beginPath();
      ctx.roundRect(20, player.y, PADDLE_W, PADDLE_H, 3);
      ctx.fill();

      // AI paddle (right)
      ctx.fillStyle = '#e0e0e0';
      ctx.beginPath();
      ctx.roundRect(W - 20 - PADDLE_W, ai.y, PADDLE_W, PADDLE_H, 3);
      ctx.fill();

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fill();

      // Overlay messages
      if (phase === 'waiting') {
        const isStart = score.player === 0 && score.ai === 0;
        drawOverlay(isStart ? 'PONG' : 'Point over', 'Press Space to continue');
      }
      if (phase === 'over') {
        const won = score.player >= WINNING_SCORE;
        drawOverlay(won ? 'You win!' : 'AI wins!', 'Press Space to play again');
      }
    }

    function drawOverlay(title, subtitle) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 56px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(title, W / 2, H / 2 - 18);

      ctx.font = '20px monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText(subtitle, W / 2, H / 2 + 28);
    }

    // ─────────────────────────────────────────────────────────────────────────
    // GAME LOOP
    // requestAnimationFrame runs this ~60 times per second
    // ─────────────────────────────────────────────────────────────────────────

    function gameLoop() {
      if (phase === 'playing') {
        movePlayer();
        moveAi();
        moveBall();
      }
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
